<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>头像风格预览</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f4f5f7; color: #1c1c1e; margin: 0; padding: 32px 24px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: #86868b; font-size: 14px; margin: 0 0 24px; }
    .row {
      background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .style-name {
      width: 160px; flex-shrink: 0;
      font-weight: 600; font-size: 14px;
    }
    .style-desc {
      color: #86868b; font-size: 12px; margin-top: 3px; font-weight: 400;
    }
    .row .avatars {
      display: flex; gap: 20px; align-items: center; flex: 1; flex-wrap: wrap;
    }
    .avatar-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .avatar-cell img {
      width: 56px; height: 56px; border-radius: 50%; display: block;
      object-fit: cover; background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .avatar-cell .label {
      font-size: 11px; color: #6e6e73;
    }
    .action {
      margin-top: 20px; padding: 14px 20px; background: #fffef0;
      border: 1px solid #f0d060; border-radius: 8px; font-size: 13px;
    }
    code {
      background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 12px;
    }
    button {
      margin-left: 8px; padding: 4px 12px; font-size: 12px; border: 1px solid #ccc;
      background: #fff; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>头像风格预览</h1>
  <p class="sub">4 个角色 × 各种 DiceBear 风格。选中风格告诉 Claude 换即可。（Claude 头像默认全部走 initials「C」+ 橙色，也可以跟随风格变化）</p>

  <div id="styles"></div>

  <div class="action">
    <b>当前使用</b>：<code>pixel-art</code>（user / bot / teacher / peer_bot）+ <code>initials「C」</code>（claude）<br><br>
    看中哪种直接告诉我"换成 xxx 风格" —— seed 也可以指定（比如 <code>seed=WeiBo</code> 让人像更符合你的名字）。
  </div>

  <script>
    // 每行统一用一个 DiceBear 风格 —— bot / peer_bot 也跟着变，看整套搭配
    const STYLES = [
      // ── 人像风 ──
      { name: 'pixel-art',           desc: '像素画/复古游戏感（当前用的）' },
      { name: 'micah',               desc: '扁平几何设计感' },
      { name: 'avataaars',           desc: 'Sketch 卡通' },
      { name: 'personas',            desc: 'Slack 圆润卡通' },
      { name: 'notionists',          desc: 'Notion 手绘' },
      { name: 'lorelei',             desc: '漂亮线条人像' },
      { name: 'open-peeps',          desc: '大头线条人' },
      { name: 'adventurer',          desc: '冒险家角色' },
      { name: 'miniavs',             desc: '极简迷你头像' },
      { name: 'croodles',            desc: '涂鸦画风' },
      // ── 机器人 / 抽象 / Emoji ──
      { name: 'bottts',              desc: '花哨机器人' },
      { name: 'bottts-neutral',      desc: '简约机器人（原来用的）' },
      { name: 'fun-emoji',           desc: '大 emoji 表情脸' },
      { name: 'big-smile',           desc: '大笑脸' },
      { name: 'big-ears',            desc: '大耳朵可爱' },
      { name: 'thumbs',              desc: '大拇指抽象' },
      // ── 完全抽象 / 无面孔 ──
      { name: 'shapes',              desc: '抽象几何形状' },
      { name: 'rings',               desc: '环形抽象' },
      { name: 'glass',               desc: '玻璃质感' },
      { name: 'identicon',           desc: 'GitHub 风 identicon' },
      { name: 'initials',            desc: '首字母（seed 首字母）' },
    ]

    // 角色 → seed（保持一致，切换风格时形象连续）
    const SEEDS = { user: 'Weibo', teacher: 'Professor', bot: 'Assistant', peer_bot: 'Peer' }
    const BG = {
      user:     'b6e3f4,c0aede',
      bot:      '00d6b9,4ecdc4',
      teacher:  'c084fc,a78bfa',
      peer_bot: 'fca5a5,f87171',
    }

    function urlFor(role, style) {
      const seed = SEEDS[role]
      const bg = BG[role]
      // 部分风格不支持背景色（比如 shapes/glass 本身是有色的），传了也没害
      return `https://api.dicebear.com/9.x/${style}/svg?seed=${seed}&backgroundColor=${bg}&backgroundType=gradientLinear`
    }
    function claudeUrl() {
      return 'https://api.dicebear.com/9.x/initials/svg?seed=Claude&backgroundColor=D97757&fontWeight=600&textColor=ffffff'
    }

    const ROLES = ['user', 'bot', 'teacher', 'claude', 'peer_bot']
    const ROLE_LABEL = { user: '用户', bot: '助手', teacher: '老师', claude: 'Claude', peer_bot: '对方助手' }

    const $ = document.getElementById('styles')
    for (const s of STYLES) {
      const row = document.createElement('div')
      row.className = 'row'
      row.innerHTML = `
        <div class="style-name">${s.name}<div class="style-desc">${s.desc}</div></div>
        <div class="avatars" id="avatars-${s.name}"></div>
      `
      $.appendChild(row)
      const grid = row.querySelector('.avatars')
      for (const role of ROLES) {
        const cell = document.createElement('div')
        cell.className = 'avatar-cell'
        const url = role === 'claude' ? claudeUrl() : urlFor(role, s.name)
        cell.innerHTML = `<img src="${url}" alt="${role}"><div class="label">${ROLE_LABEL[role]}</div>`
        grid.appendChild(cell)
      }
    }
  </script>
</body>
</html>
