<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>weixin-agent 旁观面板</title>
<script src="https://js.pusher.com/8.2/pusher.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg-chat: #ededed;
    --bg-side: #f0efee;
    --bg-side-active: #cfcecd;
    --bg-side-hover: #dedddc;
    --bg-header: #f5f5f5;
    --bubble-me: #95ec69;       /* 微信右侧绿气泡 */
    --bubble-other: #ffffff;    /* 左侧白气泡 */
    --bubble-system: rgba(0,0,0,0.08);
    --text: #1c1c1e;
    --text-inv: #1c1c1e;
    --muted: #86868b;
    --border: #d6d6d6;
    --sidebar-w: 260px;
    --avatar-size: 34px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-chat);
    color: var(--text);
    line-height: 1.5;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .wechat-layout {
    display: flex;
    height: 100vh;
    height: 100dvh;  /* iOS Safari 兼容 */
  }
  /* 手机上聊天视图打开时，body 加 chat-open 类 */
  .back-btn {
    display: none;
    background: transparent;
    border: none;
    font-size: 20px;
    padding: 4px 12px 4px 0;
    cursor: pointer;
    color: var(--text);
    line-height: 1;
    margin-right: 4px;
  }
  /* ── 左侧栏 ─────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-side);
  }
  .sidebar-header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 6px 0;
  }
  .sidebar-header .who {
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  #status {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #f0f0f5;
    color: var(--muted);
    margin-top: 6px;
  }
  #status.connected { background: #d4edda; color: #155724; }
  #status.error { background: #f8d7da; color: #721c24; }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.03);
    transition: background 0.1s;
    gap: 10px;
  }
  .conv-item:hover { background: var(--bg-side-hover); }
  .conv-item.active { background: var(--bg-side-active); }
  .conv-item .avatar {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .conv-item .info { flex: 1; min-width: 0; }
  .conv-item .name {
    font-size: 14px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv-item .preview {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }
  .conv-item .unread {
    background: #ff4d4f; color: white;
    font-size: 11px; font-weight: 600;
    min-width: 18px; height: 18px; padding: 0 6px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  /* ── 右侧栏 ─────────────────────────── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
    min-width: 0;
  }
  .chat-header {
    padding: 14px 20px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header .title { font-size: 15px; font-weight: 600; }
  .chat-header .subtitle {
    font-size: 12px; color: var(--muted); margin-top: 2px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .chat-messages-inner {
    max-width: 720px;
    margin: 0 auto;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    padding: 40px 20px;
    text-align: center;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* ── 气泡 ─────────────────────────── */
  .msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 14px;
    animation: fadeIn 0.2s ease-out;
  }
  .msg.me {
    flex-direction: row-reverse;
    animation: fadeInRight 0.2s ease-out;
  }
  .msg.other { animation: fadeInLeft 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  .msg .avatar {
    width: var(--avatar-size); height: var(--avatar-size);
    border-radius: 4px;
    background: var(--bubble-other);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.05);
  }
  .msg.me .avatar { background: #eee; }
  .msg .body { max-width: 70%; }
  .msg.me .body { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.other .body { display: flex; flex-direction: column; align-items: flex-start; }
  .msg .who-line {
    font-size: 11px; color: var(--muted);
    margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg .who-line .time { color: var(--muted); }
  .msg .bubble {
    background: var(--bubble-other);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    position: relative;
  }
  /* Markdown 元素样式 */
  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: rgba(0,0,0,0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .bubble pre {
    background: rgba(0,0,0,0.06);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 6px 0;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
  .bubble ul { list-style-type: disc; }
  .bubble ol { list-style-type: decimal; }
  .bubble li { margin-bottom: 3px; }
  .bubble li > p { margin: 0; }
  .bubble a { color: #576b95; text-decoration: none; word-break: break-all; }
  .bubble a:hover { text-decoration: underline; }
  .bubble strong { font-weight: 600; }
  .bubble em { font-style: italic; }
  .bubble blockquote {
    border-left: 3px solid rgba(0,0,0,0.15);
    padding-left: 10px;
    color: #666;
    margin: 6px 0;
  }
  .bubble h1, .bubble h2, .bubble h3 {
    margin: 10px 0 4px 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .bubble h1 { font-size: 16px; }
  .bubble hr {
    border: none;
    border-top: 1px solid rgba(0,0,0,0.1);
    margin: 8px 0;
  }
  .bubble table {
    border-collapse: collapse;
    margin: 6px 0;
    font-size: 13px;
  }
  .bubble th, .bubble td {
    border: 1px solid rgba(0,0,0,0.12);
    padding: 4px 8px;
  }
  .bubble th { background: rgba(0,0,0,0.04); font-weight: 600; }
  .msg.me .bubble {
    background: var(--bubble-me);
  }
  /* 气泡尖角（可选，简化实现） */
  .msg.other .bubble::before {
    content: "";
    position: absolute;
    left: -6px; top: 12px;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid var(--bubble-other);
  }
  .msg.me .bubble::after {
    content: "";
    position: absolute;
    right: -6px; top: 12px;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 6px solid var(--bubble-me);
  }

  /* 折叠的思考详情 */
  .details-toggle {
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,0.04);
    padding: 3px 8px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    margin-top: 4px;
    display: inline-block;
    transition: background 0.15s;
  }
  .details-toggle:hover { background: rgba(0,0,0,0.08); }
  .details-panel {
    display: none;
    margin-top: 6px;
    background: rgba(0,0,0,0.03);
    border-radius: 6px;
    padding: 8px 10px;
    max-width: 100%;
  }
  .details-panel.expanded { display: block; }
  .detail-item {
    font-size: 12px;
    margin-bottom: 6px;
    padding-left: 0;
  }
  .detail-item:last-child { margin-bottom: 0; }
  .detail-item .tag {
    display: inline-block;
    font-weight: 600;
    color: var(--muted);
    margin-right: 4px;
  }
  .detail-item.thinking .tag { color: #f57f17; }
  .detail-item.tool_call .tag { color: #d84315; font-family: "SF Mono", Menlo, monospace; }
  .detail-item.tool_out .tag { color: #ad1457; font-family: "SF Mono", Menlo, monospace; }
  .detail-item .value {
    color: #333;
    word-break: break-word;
  }
  .detail-item .value.plain {
    white-space: pre-wrap;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
  }
  /* markdown 在 details 里字号小一号 */
  .detail-item .value p { margin: 0 0 4px 0; font-size: 12px; }
  .detail-item .value p:last-child { margin-bottom: 0; }
  .detail-item .value code { font-size: 11px; }
  .detail-item .value pre { padding: 6px 8px; font-size: 11px; margin: 4px 0; }
  .detail-item .value ul, .detail-item .value ol { padding-left: 18px; margin: 4px 0; font-size: 12px; }

  /* 系统消息（居中）*/
  .msg.system {
    justify-content: center;
    animation: fadeIn 0.2s ease-out;
  }
  .msg.system .bubble {
    background: var(--bubble-system);
    color: var(--muted);
    font-size: 12px;
    max-width: 80%;
    text-align: center;
    box-shadow: none;
  }
  .msg.system .bubble::before, .msg.system .bubble::after { display: none; }

  #banner {
    position: fixed;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-width: 500px;
    padding: 24px 28px;
    background: #fff3cd;
    border: 1px solid #ffeaa7;
    border-radius: 12px;
    color: #856404;
    text-align: center;
    z-index: 100;
  }
  #banner code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; }

  /* 输入区（仅在"跟老师聊" tab 显示） */
  .chat-input-area {
    padding: 12px 16px 14px;
    background: var(--bg-header);
    border-top: 1px solid var(--border);
    display: none;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .chat-input-area.visible { display: flex; }
  .chat-input-area textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    min-height: 40px;
    max-height: 160px;
    background: white;
    outline: none;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    box-sizing: border-box;
  }
  .chat-input-area textarea:focus {
    border-color: #06ad56;
    box-shadow: 0 0 0 3px rgba(6,173,86,0.1);
  }
  .chat-input-area textarea::placeholder { color: #b0b0b0; }
  .chat-input-area button {
    background: #06ad56;
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    height: 40px;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.05s;
  }
  .chat-input-area button:hover:not(:disabled) { background: #05934a; }
  .chat-input-area button:active:not(:disabled) { transform: scale(0.97); }
  .chat-input-area button:disabled {
    background: #b6d4b7;
    cursor: not-allowed;
  }
  .input-hint {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 6px 0 0 0;
  }
  /* ── 响应式：手机（< 768px）单栏切换 ─────────────── */
  @media (max-width: 768px) {
    .sidebar {
      width: 100%;
      border-right: none;
      z-index: 5;
      background: var(--bg-side);
      padding-top: env(safe-area-inset-top);
      display: flex;  /* 覆盖桌面 flex，保证显示 */
    }
    /* 手机默认：只显示 sidebar，chat-area 完全隐藏（display none 而非 transform，
       避免首次加载时"半个屏幕"的视觉 bug） */
    .chat-area {
      display: none;
      width: 100%;
    }
    /* chat-open 时：只显示 chat-area，sidebar 隐藏 */
    .wechat-layout.chat-open .sidebar {
      display: none;
    }
    .wechat-layout.chat-open .chat-area {
      display: flex;
    }
    .back-btn { display: inline-flex; align-items: center; }
    .chat-header {
      padding: 12px 14px calc(12px + env(safe-area-inset-top)) 14px;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .chat-header .title { font-size: 15px; }
    .chat-header .subtitle { font-size: 11px; }
    .chat-messages {
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    }
    .chat-messages-inner { max-width: 100%; }
    .msg .body { max-width: 78%; }
    .msg .bubble {
      font-size: 15px;  /* 手机稍大 */
    }
    .conv-item { padding: 14px 16px; }
    .conv-item .name { font-size: 15px; }
    .conv-item .preview { font-size: 13px; }
    .conv-item .avatar {
      width: 40px; height: 40px; font-size: 20px;
    }
    .sidebar-header {
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .chat-input-area {
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    }
    .chat-input-area textarea {
      font-size: 16px;  /* iOS 防自动缩放 */
    }
    /* details 折叠面板手机上字号 */
    .details-toggle { font-size: 12px; padding: 4px 10px; }
  }

  /* 输入中的"..."气泡 */
  .typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--bubble-other);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    position: relative;
  }
  .typing-bubble::before {
    content: "";
    position: absolute;
    left: -6px; top: 12px;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid var(--bubble-other);
  }
  .typing-bubble .dot {
    width: 6px; height: 6px;
    background: #999;
    border-radius: 50%;
    animation: bounceDot 1.4s infinite;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounceDot {
    0%,80%,100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-5px); opacity: 1; }
  }
</style>
</head>
<body>
<div class="wechat-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>旁观面板</h1>
      <span id="status">连接中…</span>
    </div>
    <div class="conv-list" id="convList"></div>
  </aside>
  <section class="chat-area">
    <div class="chat-header">
      <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
      <div style="flex:1; min-width:0;">
        <div class="title" id="chatTitle">选择一个会话</div>
        <div class="subtitle" id="chatSubtitle"></div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-messages-inner" id="chatInner"></div>
    </div>
    <div class="chat-input-area" id="inputArea">
      <textarea id="panelInput" placeholder="回车发送，Shift+Enter 换行" rows="1"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </section>
</div>

<script>
const $status = document.getElementById('status');
const $convList = document.getElementById('convList');
const $backBtn = document.getElementById('backBtn');
const $layout = document.querySelector('.wechat-layout');
const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
const $chatTitle = document.getElementById('chatTitle');
const $chatSubtitle = document.getElementById('chatSubtitle');
const $chatMessages = document.getElementById('chatMessages');
const $chatInner = document.getElementById('chatInner');
const $inputArea = document.getElementById('inputArea');
const $panelInput = document.getElementById('panelInput');
const $sendBtn = document.getElementById('sendBtn');

const params = new URLSearchParams(location.search);
const token = params.get('token');
const userId = params.get('user_id');

const API = '/api/dashboard';

// ── 会话：每个 conv 存 items: [{kind, ...}] ──
// item.kind ∈ 'user' | 'assistant' | 'system' | 'agent_out' | 'agent_in'
// assistant 类型的 item 有 .details: [{type, text}] 存该次 reply 前的思考/工具事件
const conversations = {
  self: {
    id: 'self',
    name: '我和助手',
    icon: '🤖',
    items: [],
    unread: 0,
    isPair: false,
    _pendingDetails: [],  // 累积到下一个 assistant 的 details
  },
  teacher: {
    id: 'teacher',
    name: '老师 Agent',
    icon: '👨‍🏫',
    items: [],
    unread: 0,
    isPair: false,
    isTeacher: true,
    historyLoaded: false,
    _pendingDetails: [],
  },
  claude: {
    id: 'claude',
    name: 'Claude',
    icon: '🤖',
    items: [],
    unread: 0,
    isPair: false,
    isClaude: true,
    historyLoaded: false,
    _pendingDetails: [],
  },
};
let currentConvId = 'self';

function setStatus(text, cls) { $status.textContent = text; $status.className = cls || ''; }
function showBanner(msg) {
  const div = document.createElement('div'); div.id = 'banner'; div.innerHTML = msg;
  document.body.appendChild(div);
}
function formatTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

// Markdown 渲染：加载失败或 CDN 挂了自动降级为纯文本转 <br>
function renderMarkdown(text) {
  if (!text) return '';
  try {
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
      throw new Error('markdown lib not loaded');
    }
    const html = marked.parse(text, { breaks: true, gfm: true });
    return DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
  } catch (e) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }
}

// ── 侧栏 ──
function renderSidebar() {
  $convList.innerHTML = '';
  const selfConv = conversations.self;
  const teacherConv = conversations.teacher;
  const claudeConv = conversations.claude;
  const pairs = Object.values(conversations).filter(c => c.isPair);
  const items = [selfConv, teacherConv, claudeConv, ...pairs];
  for (const conv of items) {
    const el = document.createElement('div');
    el.className = 'conv-item' + (conv.id === currentConvId ? ' active' : '');
    el.onclick = () => selectConversation(conv.id);
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = conv.icon;
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = conv.name;
    const preview = document.createElement('div');
    preview.className = 'preview';
    preview.textContent = conv.items.length
      ? (conv.items[conv.items.length - 1].text || '').slice(0, 30)
      : (conv.isPair ? '暂无对话' : '等待开始…');
    info.appendChild(name); info.appendChild(preview);
    el.appendChild(avatar); el.appendChild(info);
    if (conv.unread > 0 && conv.id !== currentConvId) {
      const badge = document.createElement('span');
      badge.className = 'unread';
      badge.textContent = conv.unread > 99 ? '99+' : conv.unread;
      el.appendChild(badge);
    }
    $convList.appendChild(el);
  }
}

// ── 消息渲染 ──
function makeBubble(item) {
  // item: { kind, text, time, ...extra }
  const wrap = document.createElement('div');
  const isMe = (item.kind === 'user') || (item.kind === 'agent_out');
  const isSys = item.kind === 'system';
  wrap.className = 'msg ' + (isSys ? 'system' : (isMe ? 'me' : 'other'));

  if (!isSys) {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = ({
      user: '👤', assistant: '🤖', agent_out: '🤖', agent_in: '🔀',
    })[item.kind] || '·';
    wrap.appendChild(avatar);
  }

  const body = document.createElement('div');
  body.className = 'body';

  if (!isSys) {
    const line = document.createElement('div');
    line.className = 'who-line';
    line.textContent = ({
      user: '我', assistant: item.agentName || '助手',
      agent_out: item.agentName || '我的助手',
      agent_in: item.agentName || '对方助手',
    })[item.kind];
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = ' · ' + formatTime(item.time);
    line.appendChild(time);
    body.appendChild(line);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  // 系统消息保持纯文本；其他气泡（用户/助手/agent）走 markdown 渲染
  if (isSys) {
    bubble.textContent = item.text || '';
  } else {
    bubble.innerHTML = renderMarkdown(item.text || '');
  }
  body.appendChild(bubble);

  // Agent reply 前的思考/工具调用 → 折叠详情
  if (item.kind === 'assistant' && item.details && item.details.length) {
    const toggle = document.createElement('span');
    toggle.className = 'details-toggle';
    toggle.textContent = `▲ 展开思考过程（${item.details.length}）`;
    const panel = document.createElement('div');
    panel.className = 'details-panel';
    for (const d of item.details) {
      const di = document.createElement('div');
      di.className = 'detail-item ' + d.type;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = ({
        thinking: '💭 思考',
        tool_call: '🔧 调用',
        tool_out: '↩️ 结果',
      })[d.type] || d.type;
      const val = document.createElement('span');
      val.className = 'value';
      // tool_call（工具调用签名）保留原样 monospace；thinking / tool_out 走 markdown
      if (d.type === 'tool_call') {
        val.classList.add('plain');
        val.textContent = d.text || '';
      } else {
        val.innerHTML = renderMarkdown(d.text || '');
      }
      di.appendChild(tag); di.appendChild(val);
      panel.appendChild(di);
    }
    toggle.onclick = () => {
      panel.classList.toggle('expanded');
      toggle.textContent = panel.classList.contains('expanded')
        ? `▼ 收起思考过程（${item.details.length}）`
        : `▲ 展开思考过程（${item.details.length}）`;
    };
    body.appendChild(toggle);
    body.appendChild(panel);
  }

  wrap.appendChild(body);
  return wrap;
}

function renderChatArea() {
  const conv = conversations[currentConvId];
  if (!conv) {
    $chatInner.innerHTML = '';
    $chatTitle.textContent = '选择一个会话';
    $chatSubtitle.textContent = '';
    $inputArea.classList.remove('visible');
    return;
  }
  $chatTitle.textContent = conv.name;
  $chatSubtitle.textContent = conv.isTeacher
    ? '苏格拉底式启发 + 费曼式简化解释（每用户独立记忆）'
    : (conv.isClaude
       ? 'Claude Code CLI（跑在你 Mac 上），需要本地 daemon 在线才能对话'
       : (conv.isPair
          ? '跨 Agent 对话（默认不打扰双方微信，只在此显示）'
          : `观察对象：${userId}`));
  // 输入框对所有 tab 显示；placeholder 根据 conv 动态
  $inputArea.classList.add('visible');
  $panelInput.placeholder = conv.isTeacher
    ? '想搞懂什么？回车发送，Shift+Enter 换行'
    : (conv.isClaude
       ? 'Claude 是编程 + 执行专家，问什么都行'
       : (conv.isPair
          ? `直接跟「${conv.name.split('↔').pop().trim()}」说一句（以你自己身份）`
          : '跟你的助手说...（回车发送，Shift+Enter 换行）'));
  setTimeout(() => $panelInput.focus(), 100);
  $chatInner.innerHTML = '';
  if (conv.items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = conv.isTeacher
      ? `<div class="icon">👨‍🏫</div>老师在这里 —— 想搞懂什么就问吧`
      : (conv.isPair
         ? `<div class="icon">🔀</div>暂无对话内容，等待 Agent 之间交流…`
         : `<div class="icon">💬</div>暂无对话，去微信里跟你的助手说点什么吧`);
    $chatInner.appendChild(empty);
    return;
  }
  for (const item of conv.items) {
    $chatInner.appendChild(makeBubble(item));
  }
  requestAnimationFrame(() => {
    $chatMessages.scrollTop = $chatMessages.scrollHeight;
  });
}

function selectConversation(convId) {
  currentConvId = convId;
  const conv = conversations[convId];
  if (conv) conv.unread = 0;
  // 首次打开非 self 会话时按需拉历史（走同一个统一 API）
  if (conv && !conv.historyLoaded && (conv.isTeacher || conv.isClaude)) {
    conv.historyLoaded = true;
    loadConvHistory(convId);
  }
  renderSidebar();
  renderChatArea();
  // 手机上：切换到聊天视图
  if (window.matchMedia('(max-width: 768px)').matches) {
    $layout.classList.add('chat-open');
  }
}

// 返回按钮：手机上从聊天视图回到会话列表
$backBtn.addEventListener('click', () => {
  $layout.classList.remove('chat-open');
});

// 初始：手机上默认显示会话列表（不进任何 chat）
if (window.matchMedia('(max-width: 768px)').matches) {
  $layout.classList.remove('chat-open');
}

// 通用历史加载（所有 tab 走同一段代码 + 同一个端点）
async function loadConvHistory(convId) {
  try {
    const r = await fetch(
      `${API}/panel-history?uid=${encodeURIComponent(userId)}` +
      `&token=${encodeURIComponent(token)}` +
      `&conv_id=${encodeURIComponent(convId)}&limit=50`
    );
    if (!r.ok) return;
    const data = await r.json();
    if (!data.messages || !data.messages.length) return;
    const conv = conversations[convId];
    if (!conv) return;
    for (const m of data.messages) {
      const kind = m.role === 'assistant' ? 'assistant'
                 : (m.role === 'system' ? 'system' : 'user');
      conv.items.push({ kind, text: m.content, time: Date.now(), historical: true });
    }
    if (currentConvId === convId) renderChatArea();
    renderSidebar();
  } catch (e) { console.warn(`${convId} 历史加载失败`, e); }
}

let _typingBubbleEl = null;

function showTypingBubble(icon = '🤖') {
  removeTypingBubble();
  const wrap = document.createElement('div');
  wrap.className = 'msg other';
  wrap.dataset.typing = '1';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = icon;
  const body = document.createElement('div');
  body.className = 'body';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    dot.className = 'dot';
    bubble.appendChild(dot);
  }
  body.appendChild(bubble);
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  $chatInner.appendChild(wrap);
  _typingBubbleEl = wrap;
  requestAnimationFrame(() => {
    $chatMessages.scrollTop = $chatMessages.scrollHeight;
  });
}
function removeTypingBubble() {
  if (_typingBubbleEl && _typingBubbleEl.parentNode) {
    _typingBubbleEl.parentNode.removeChild(_typingBubbleEl);
  }
  _typingBubbleEl = null;
}

function autoGrowPanelInput() {
  $panelInput.style.height = 'auto';
  $panelInput.style.height = Math.min($panelInput.scrollHeight, 160) + 'px';
}

// 通用去重：记住每个会话最后一次前端发出的消息，收到 pusher 回声时跳过
const _lastSentPerConv = {};

async function sendMessageInCurrentConv(text) {
  const trimmed = (text || '').trim();
  if (!trimmed) return;
  const conv = conversations[currentConvId];
  if (!conv) return;

  $sendBtn.disabled = true;
  $panelInput.disabled = true;

  // 在当前会话追加自己的气泡（optimistic）
  _lastSentPerConv[currentConvId] = trimmed;
  appendItemToConv(currentConvId, { kind: 'user', text: trimmed, time: Date.now(), local: true });
  $panelInput.value = '';
  autoGrowPanelInput();

  // "打字中" 三点动画：老师👨‍🏫 / Claude🤖 / Agent 间🔀 / 自己助手🤖
  const typingIcon = conv.isTeacher ? '👨‍🏫' : (conv.isClaude ? '🤖' : (conv.isPair ? '🔀' : '🤖'));
  showTypingBubble(typingIcon);

  try {
    const r = await fetch(`${API}/panel-chat`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        user_id: userId,
        token,
        conv_id: currentConvId,
        message: trimmed,
      }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      removeTypingBubble();
      appendItemToConv(currentConvId, {
        kind: 'system', text: `❌ 处理失败：${err.error || r.status}`, time: Date.now(),
      });
    }
    // 对老师：teacher_reply 事件会移除 typing bubble
    // 对 self：assistant_reply 事件会移除
    // 对 pair：agent_conversation ← 事件会移除
  } catch (e) {
    removeTypingBubble();
    appendItemToConv(currentConvId, {
      kind: 'system', text: `❌ 网络错误：${e.message}`, time: Date.now(),
    });
  } finally {
    $sendBtn.disabled = false;
    $panelInput.disabled = false;
    $panelInput.focus();
  }
}

$panelInput.addEventListener('input', autoGrowPanelInput);
$panelInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.nativeEvent.isComposing || e.keyCode === 229) return;
  if (e.altKey || e.shiftKey) {
    e.preventDefault();
    const el = e.currentTarget;
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const v = el.value.slice(0, start) + '\n' + el.value.slice(end);
    el.value = v;
    el.selectionStart = el.selectionEnd = start + 1;
    autoGrowPanelInput();
  } else {
    e.preventDefault();
    sendMessageInCurrentConv($panelInput.value);
  }
});
$sendBtn.addEventListener('click', () => sendMessageInCurrentConv($panelInput.value));

// ── 事件路由 ──
function appendItemToConv(convId, item) {
  const conv = conversations[convId];
  if (!conv) return;
  conv.items.push(item);
  if (convId === currentConvId) {
    if (conv.items.length === 1) {
      renderChatArea();
    } else {
      $chatInner.appendChild(makeBubble(item));
      requestAnimationFrame(() => {
        $chatMessages.scrollTop = $chatMessages.scrollHeight;
      });
    }
    renderSidebar();
  } else {
    conv.unread = (conv.unread || 0) + 1;
    renderSidebar();
  }
}

// 收到 user_message
function handleUser(text) {
  conversations.self._pendingDetails = [];
  // 如果这条正好是本地刚 optimistic 发出的，跳过重复
  if (text && text === _lastSentPerConv.self) {
    _lastSentPerConv.self = '';
    return;
  }
  appendItemToConv('self', { kind: 'user', text, time: Date.now() });
}

// 收到 verbose 事件（思考/工具）
function handleVerbose(type, text) {
  conversations.self._pendingDetails.push({ type, text });
}

// 收到 assistant_reply
function handleAssistant(text) {
  if (currentConvId === 'self') removeTypingBubble();
  const details = conversations.self._pendingDetails;
  conversations.self._pendingDetails = [];
  appendItemToConv('self', {
    kind: 'assistant', text, time: Date.now(),
    details: details.slice(),
  });
}

// 收到 system_event
function handleSystem(text) {
  appendItemToConv('self', { kind: 'system', text, time: Date.now() });
}

// 收到 agent_conversation
function handleAgentConversation(data) {
  const otherUid = data.from_user_id === userId ? data.to_user_id : data.from_user_id;
  const otherName = data.from_user_id === userId ? data.to : data.from;
  const myName = data.from_user_id === userId ? data.from : data.to;
  const convId = `pair-${otherUid}`;
  if (!conversations[convId]) {
    conversations[convId] = {
      id: convId,
      name: `${myName || '我的助手'} ↔ ${otherName}`,
      icon: '🔀',
      items: [],
      unread: 0,
      isPair: true,
      otherUid,
      _pendingDetails: [],
    };
  }
  const isMineOutgoing = data.from_user_id === userId;
  // 去重 optimistic
  if (isMineOutgoing && data.text && data.text === _lastSentPerConv[convId]) {
    _lastSentPerConv[convId] = '';
    return;
  }
  // 对方回复 → 移除 typing
  if (!isMineOutgoing && currentConvId === convId) removeTypingBubble();
  appendItemToConv(convId, {
    kind: isMineOutgoing ? 'agent_out' : 'agent_in',
    text: data.text || '',
    agentName: data.from,
    time: Date.now(),
  });
}

// ── 参数校验 ──
if (!token || !userId) {
  showBanner('❌ 缺少 <code>token</code> 或 <code>user_id</code> 参数。<br>请在微信里向 bot 发一句「<b>/看板</b>」。');
  setStatus('参数缺失', 'error');
  throw new Error('missing params');
}

renderSidebar();
renderChatArea();

// ── bootstrap ──
(async () => {
  let cfg;
  try {
    const r = await fetch(`${API}/config?uid=${encodeURIComponent(userId)}&token=${encodeURIComponent(token)}`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      showBanner(`❌ ${err.error || '鉴权失败'}<br>请在微信里重新发「<b>/看板</b>」。`);
      setStatus('鉴权失败', 'error');
      return;
    }
    cfg = await r.json();
  } catch (e) {
    showBanner(`❌ 连接后端失败：${e.message}`);
    setStatus('连接失败', 'error');
    return;
  }

  // self 会话历史（用统一的 panel-history）
  loadConvHistory('self');

  const pusher = new Pusher(cfg.pusher_key, {
    cluster: cfg.pusher_cluster,
    authEndpoint: `${API}/pusher-auth?token=${encodeURIComponent(token)}`,
  });
  pusher.connection.bind('connected', () => setStatus('● 实时连接中', 'connected'));
  pusher.connection.bind('disconnected', () => setStatus('已断开', 'error'));
  pusher.connection.bind('error', () => setStatus('连接错误', 'error'));

  const channel = pusher.subscribe(cfg.channel);
  channel.bind('pusher:subscription_error', (e) => {
    console.error('订阅失败', e);
    setStatus('订阅失败', 'error');
  });

  channel.bind('user_message', (d) => handleUser(d.text || ''));
  channel.bind('assistant_reply', (d) => handleAssistant(d.text || ''));
  channel.bind('verbose_thinking', (d) => handleVerbose('thinking', d.text || ''));
  channel.bind('verbose_tool_call', (d) => handleVerbose('tool_call', d.text || ''));
  channel.bind('verbose_tool_out', (d) => handleVerbose('tool_out', d.text || ''));
  channel.bind('system_event', (d) => handleSystem(d.text || ''));
  channel.bind('agent_conversation', (d) => handleAgentConversation(d));

  // 老师相关事件
  channel.bind('teacher_user_message', (d) => handleTeacherUser(d.text || ''));
  channel.bind('teacher_reply', (d) => handleTeacherReply(d.text || ''));
  channel.bind('teacher_thinking', (d) => handleTeacherVerbose('thinking', d.text || ''));
  channel.bind('teacher_tool_call', (d) => handleTeacherVerbose('tool_call', d.text || ''));
  channel.bind('teacher_tool_out', (d) => handleTeacherVerbose('tool_out', d.text || ''));

  // Claude 相关事件
  channel.bind('claude_user_message', (d) => handleClaudeUser(d.text || ''));
  channel.bind('claude_reply', (d) => handleClaudeReply(d.text || ''));
})();

// Claude 事件路由
function handleClaudeUser(text) {
  if (text && text === _lastSentPerConv.claude) {
    _lastSentPerConv.claude = '';
    return;
  }
  appendItemToConv('claude', { kind: 'user', text, time: Date.now() });
}
function handleClaudeReply(text) {
  if (currentConvId === 'claude') removeTypingBubble();
  appendItemToConv('claude', {
    kind: 'assistant', text, time: Date.now(),
    agentName: 'Claude',
  });
}

// 老师事件路由（跟 self 会话对称）
function handleTeacherUser(text) {
  conversations.teacher._pendingDetails = [];
  if (text && text === _lastSentPerConv.teacher) {
    _lastSentPerConv.teacher = '';
    return;
  }
  appendItemToConv('teacher', { kind: 'user', text, time: Date.now() });
}
function handleTeacherVerbose(type, text) {
  conversations.teacher._pendingDetails.push({ type, text });
}
function handleTeacherReply(text) {
  if (currentConvId === 'teacher') removeTypingBubble();
  const details = conversations.teacher._pendingDetails;
  conversations.teacher._pendingDetails = [];
  appendItemToConv('teacher', {
    kind: 'assistant', text, time: Date.now(),
    agentName: '老师',
    details: details.slice(),
  });
}
</script>
