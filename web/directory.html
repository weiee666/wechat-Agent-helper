<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>上传公司通讯录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; --accent:#0a84ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
           background:var(--bg); color:var(--fg); display:flex; min-height:100vh;
           align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; border-radius:20px; padding:36px 32px; max-width:420px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:14px; margin:0 0 22px; line-height:1.6; }
    input[type=file] { width:100%; padding:14px; border:2px dashed #d0d0d5; border-radius:12px;
                       background:#fafafa; font-size:14px; }
    button { margin-top:16px; width:100%; background:var(--accent); color:#fff; border:0;
             border-radius:12px; padding:12px; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .status { margin-top:16px; font-size:14px; min-height:22px; }
    .ok { color:#1a9d4b; font-weight:600; }
    .err { color:#d83a3a; }
    .hint { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>上传公司通讯录</h1>
    <p class="sub">选择员工表（CSV 或 Excel），上传后替换服务器上的通讯录。<br>
       表里要有「姓名/First Name+Last Name」和「邮箱/Email」列。</p>
    <input type="file" id="file" accept=".csv,.xlsx,.xls">
    <button id="btn" disabled>上传</button>
    <div class="status" id="status"></div>
    <div class="hint">上传会整表覆盖现有通讯录。派任务时，系统按姓名在这张表里查邮箱。</div>
  </div>

  <script>
    const fileEl = document.getElementById('file');
    const btn = document.getElementById('btn');
    const statusEl = document.getElementById('status');

    fileEl.onchange = () => { btn.disabled = !fileEl.files.length; statusEl.textContent = ''; };

    btn.onclick = async () => {
      const f = fileEl.files[0];
      if (!f) return;
      btn.disabled = true;
      statusEl.textContent = '上传中…';
      try {
        const r = await fetch('/api/upload-directory', {
          method: 'POST',
          headers: { 'x-filename': f.name },
          body: f,
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          statusEl.innerHTML = '<span class="ok">✅ 上传成功，通讯录已更新为 ' + data.count + ' 人。</span>';
        } else {
          statusEl.innerHTML = '<span class="err">❌ ' + (data.error || ('失败 ' + r.status)) + '</span>';
        }
      } catch (e) {
        statusEl.innerHTML = '<span class="err">❌ 网络错误：' + e + '</span>';
      }
      btn.disabled = false;
    };
  </script>
</body>
</html>
