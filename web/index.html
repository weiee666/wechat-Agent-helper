<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>连接任务助手</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; --accent:#0a84ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
           background:var(--bg); color:var(--fg); display:flex; min-height:100vh;
           align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; border-radius:20px; padding:36px 32px; max-width:380px; width:100%;
            box-shadow:0 12px 40px rgba(0,0,0,.08); text-align:center; }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:14px; margin:0 0 24px; }
    .qr { width:260px; height:260px; margin:0 auto 18px; display:flex; align-items:center;
          justify-content:center; }
    .qr svg { width:100%; height:100%; }
    .status { font-size:14px; color:var(--muted); min-height:22px; }
    .ok { color:#1a9d4b; font-weight:600; font-size:16px; }
    .steps { text-align:left; color:var(--muted); font-size:13px; line-height:1.7; margin:18px 0 0; }
    button { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:12px;
             padding:10px 20px; font-size:15px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>连接任务助手</h1>
    <p class="sub">用微信扫码，绑定你自己的 AI 任务助手</p>
    <div class="qr" id="qr">正在生成二维码…</div>
    <div class="status" id="status"></div>
    <div class="steps">
      1. 打开微信 → 扫一扫，扫描上方二维码<br>
      2. 在手机上点「确认登录」<br>
      3. 看到「连接成功」后，去微信里找到这个助手开始对话
    </div>
  </div>

  <script>
    const qrEl = document.getElementById('qr');
    const statusEl = document.getElementById('status');
    let ticket = null, timer = null, lastSvg = '';

    const STATUS_TEXT = {
      starting: '正在生成二维码…',
      wait: '请用微信扫码',
      scaned: '已扫码，请在手机上确认…',
      expired: '二维码已过期',
      error: '出错了，请刷新重试',
    };

    function render(data) {
      if (data.qr_svg && data.qr_svg !== lastSvg) { qrEl.innerHTML = data.qr_svg; lastSvg = data.qr_svg; }
      if (data.status === 'confirmed') {
        clearInterval(timer);
        qrEl.innerHTML = '✅';
        qrEl.style.fontSize = '72px';
        statusEl.innerHTML = '<span class="ok">连接成功！去微信里找你的助手聊天吧</span>';
        return;
      }
      statusEl.textContent = STATUS_TEXT[data.status] || data.status || '';
    }

    async function start() {
      statusEl.textContent = '正在生成二维码…';
      const r = await fetch('/api/connect/start', { method: 'POST' });
      const data = await r.json();
      ticket = data.ticket;
      render(data);
      timer = setInterval(poll, 2000);
    }

    async function poll() {
      if (!ticket) return;
      try {
        const r = await fetch('/api/connect/status?ticket=' + encodeURIComponent(ticket));
        if (!r.ok) return;
        render(await r.json());
      } catch (e) { /* 网络抖动，下次再试 */ }
    }

    start();
  </script>
</body>
</html>
