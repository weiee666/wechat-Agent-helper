name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_HOST: 43.142.81.135
  DEPLOY_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/weixin-agent
  SERVICE_NAME: weixin-agent.service

jobs:
  deploy:
    name: Sync code & restart service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to server
        # 同步代码到服务器，保留服务器上的 .env / data / secrets / .venv
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='**/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='data/' \
            --exclude='secrets/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='.idea/' \
            --exclude='.claude/' \
            --exclude='项目交接文档.md' \
            ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: Install deps & restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'set -e
             cd ${{ env.DEPLOY_DIR }}
             echo "── 当前 .venv pip 版本 ──"
             ./.venv/bin/pip --version
             echo ""
             echo "── 安装 / 同步 requirements.txt ──"
             ./.venv/bin/pip install --upgrade pip
             ./.venv/bin/pip install --upgrade -r requirements.txt
             echo ""
             echo "── 已安装的关键依赖 ──"
             ./.venv/bin/pip list --format=columns | grep -iE "^(fastapi|uvicorn|langchain|openai|requests|python-dotenv|pypinyin|openpyxl)" || true
             echo ""
             echo "── 重启服务 ──"
             sudo systemctl restart ${{ env.SERVICE_NAME }}
             sleep 2
             sudo systemctl is-active ${{ env.SERVICE_NAME }}
             sudo systemctl status ${{ env.SERVICE_NAME }} --no-pager -n 15 || true'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                 ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
                 'curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/healthz 2>/dev/null | grep -qE "^(200|301|302|401|403|404)$"'; then
              echo "✅ /healthz responding"
              exit 0
            fi
            echo "尝试 $i/5 失败，2 秒后重试…"
            sleep 2
          done
          echo "❌ Health check failed"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'sudo journalctl -u ${{ env.SERVICE_NAME }} -n 40 --no-pager' || true
          exit 1
